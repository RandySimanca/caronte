<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Sistema profesional de gestión de préstamos y cobros en campo. Funciona sin conexión a Internet." />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/Caronte.png" />
    <title>Caronte</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Suppress non-fatal web-vitals bfcache error from Workbox PWA plugin -->
    <script>
      window.addEventListener('error', function(e) {
        if (e.message && e.message.includes('startTime')) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
